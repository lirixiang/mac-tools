description = "土味情话 CLI — 1000+ 条情话，随机抽取、分类查询、搜索"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
qinghua = "talk_art:main"

[build-system]
requires = ["setuptools>=68.0"]
